
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-deployment
  namespace: {{ .Values.namespace }}
  labels:
    app: order-service
spec:
  replicas: {{ .Values.order.replicaCount }}
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      serviceAccountName: microservices-sa
      automountServiceAccountToken: false
      containers:
        - name: order-container
          image: "{{ .Values.order.image.repository }}:{{ .Values.order.image.tag }}"
          imagePullPolicy: {{ .Values.order.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.order.containerPort }}
          readinessProbe:
            httpGet:
              path: {{ .Values.order.healthPath }}
              port: {{ .Values.order.containerPort }}
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: {{ .Values.order.healthPath }}
              port: {{ .Values.order.containerPort }}
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            {{- toYaml .Values.order.resources | nindent 12 }}
