
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: {{ .Values.namespace }}
  labels:
    app: product-service
spec:
  type: {{ .Values.product.service.type }}
  selector:
    app: product-service
  ports:
    - name: http
      port: {{ .Values.product.service.port }}
      targetPort: {{ .Values.product.containerPort }}
      protocol: TCP
